version: "3.8"

services:
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.2.2
    ports:
      - "5000:5000"
    environment:
      - MLFLOW_BACKEND_STORE_URI=sqlite:///mlflow.db
      - MLFLOW_ARTIFACT_ROOT=/mlruns
    volumes:
      - ./mlruns:/mlruns
    command: mlflow server --backend-store-uri sqlite:///mlflow.db --default-artifact-root /mlruns --host 0.0.0.0

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    ports:
      - "8000:8000"
    volumes:
      - ./data/processed:/app/data/processed
      - ./mlruns:/mlruns
    depends_on:
      - mlflow
    networks:
      - default
    command: uvicorn src.api.basicAPI:app --host 0.0.0.0 --port 8000

  # Dummy service to build the preprocessing image
  preprocessing:
    build:
      context: .
      dockerfile: Dockerfile.preprocessing
    image: weather_australia_preprocessing:latest
    entrypoint: ["echo", "preprocessing image built"]

  # Dummy service to build the modelling image
  modelling:
    build:
      context: .
      dockerfile: Dockerfile.modelling
    image: weather_australia_modelling:latest
    entrypoint: ["echo", "modelling image built"]
    volumes:
      - ./mlruns:/mlruns

  airflow:
    image: apache/airflow:2.9.1
    environment:
      - AIRFLOW__API__AUTH_BACKENDS=airflow.api.auth.backend.session,airflow.api.auth.backend.basic_auth
      - AIRFLOW__CORE__EXECUTOR=SequentialExecutor
      - AIRFLOW__CORE__FERNET_KEY=${AIRFLOW__CORE__FERNET_KEY}
      - AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION=False
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - HOST_PROJECT_PATH=${HOST_PROJECT_PATH}
      - _PIP_ADDITIONAL_REQUIREMENTS=apache-airflow-providers-docker
    volumes:
      - ./dags:/opt/airflow/dags
      - ./data:/opt/airflow/data
      - ./data:/app/data
      - airflow_db:/opt/airflow
      - //var/run/docker.sock:/var/run/docker.sock
    networks:
      - default
    ports:
      - "8080:8080"
    command: webserver

  airflow-scheduler:
    image: apache/airflow:2.9.1
    environment:
      - AIRFLOW__API__AUTH_BACKENDS=airflow.api.auth.backend.session,airflow.api.auth.backend.basic_auth
      - AIRFLOW__CORE__EXECUTOR=SequentialExecutor
      - AIRFLOW__CORE__FERNET_KEY=${AIRFLOW__CORE__FERNET_KEY}
      - AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION=False
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - HOST_PROJECT_PATH=${HOST_PROJECT_PATH}
      - _PIP_ADDITIONAL_REQUIREMENTS=apache-airflow-providers-docker
    volumes:
      - ./dags:/opt/airflow/dags
      - ./data:/opt/airflow/data
      - ./data:/app/data
      - airflow_db:/opt/airflow
      - //var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - airflow
    networks:
      - default
    command: scheduler
  
  airflow-exporter:
    build:
      context: ./monitoring/airflow-exporter
      dockerfile: Dockerfile.airflow_metric
    environment:
      - AIRFLOW_EXPORTER_HOST=http://airflow:8080
      - AIRFLOW_EXPORTER_PORT=9112
      - AIRFLOW_EXPORTER_UPDATE_INTERVAL=15
      - AIRFLOW_EXPORTER_USERNAME=admin
      - AIRFLOW_EXPORTER_PASSWORD=admin
    ports:
      - "9112:9112"
    volumes:
      - ./dags:/opt/airflow/dags
    depends_on:
      - airflow
    networks:
      - default
    command: python -u exporter.py

  prometheus:
    image: prom/prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
    depends_on:
      - api
      - airflow-exporter
      - node-exporter
      - cadvisor
    networks:
      - default

  grafana:
    image: grafana/grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana-storage:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
      - ./monitoring/grafana/conf/grafana.ini:/etc/grafana/grafana.ini
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    depends_on:
      - prometheus

  # Exporters
  
  node-exporter:
    image: prom/node-exporter
    ports:
      - "9100:9100"

  cadvisor:
    image: gcr.io/cadvisor/cadvisor
    ports:
      - "8081:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:rw

volumes:
  airflow_db:
  grafana-storage:

networks:
  default:
    driver: bridge